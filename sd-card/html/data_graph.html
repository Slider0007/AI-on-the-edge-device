<!DOCTYPE html>
<html lang="en" xml:lang="en">
<head>
  <meta charset="UTF-8">
  <title>Data Graph</title>
  <style>
    h1 {font-size: 1.8em;}
    h2 {font-size: 1.5em; margin-block-start: 0.0em; margin-block-end: 0.2em;}
    h3 {font-size: 1.2em;}
    p {font-size: 1em;}

    body, html {
        font-size: 100%;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        font-family: Arial, sans-serif;
    }

    select, input[type=number],
    input[type=datetime-local] {
      padding: 3px 5px;
      display: inline-block;
      border: 1px solid #ccc;
      font-size: 16px;
      vertical-align: middle;
      margin-right: 10px;
    }

    .button {
      padding: 5px 10px;
      min-width: 170px;
      width: 170px;
      max-width: 170px;
      font-size: 16px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .controls .row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .chart {
      width: 100%;
      min-width: 660px;
      max-width: 1022px;
      height: 450px;
      margin: 20px 5px;
    }
  </style>

  <script src="jquery-3.6.0.min.js?v=$COMMIT_HASH"></script>
  <script src="js.cookie.min.js?v=$COMMIT_HASH"></script>
  <link href="firework.css?v=$COMMIT_HASH" rel="stylesheet">
  <script src="firework.js?v=$COMMIT_HASH"></script>
  <script src="plotly-basic.min.js?v=$COMMIT_HASH"></script>
  <script src="global_common.js?v=$COMMIT_HASH"></script>
  <script src="global_data.js?v=$COMMIT_HASH"></script>
</head>

<body>
<h2>Data Graph</h2>

<div class="controls">
  <div class="row" style="margin-top:20px;">
    Number Sequence: <select id="sequence_selection"
        style="width:120px; max-width:120px; min-width:120px;white-space:nowrap; overflow:hidden" onchange="ManualRefreshContent()">
    </select>
    <button class="button" style="margin-left:10px"
              onclick="window.location.href='data_viewer.html?v=$COMMIT_HASH'">Show Data Viewer</button>
    <button class="button" onclick="window.location.href=getDomainname() + '/fileserver/log/data/'">Show Data Files</button>
  </div>
  <div class="row">
    Start: <input type="datetime-local" id="startTime" style="margin-right:5px;">
    End: <input type="datetime-local" id="endTime">
    <button class="button" style="width:100px;max-width:100px;min-width:100px"
              onclick="ManualRefreshContent()"><b>Refresh</b></button>
    <img style="visibility:hidden; width:16px; height:16px;" id="manual_refresh_img_loading" src="">
  </div>
  <div class="row">
    <input type="checkbox" id="AutoRefreshEnabled" value="1" onchange="AutoRefreshContent();">
    <label for="AutoRefreshEnabled"><span id="AutoRefreshEnabled_text">Auto Refresh:</span></label>
    <input type="number" id="AutoRefreshTime" min="1" value="60" style="margin-left:5px;margin-right:0px;width:60px;"
            onchange="(!validity.rangeUnderflow||(value=1));AutoRefreshContent();">s
    <output id="timestamp" style="margin-left:45px">Last Refresh:</output>
  </div>
</div>
<div id="chartLoadingText"><p>Loading charts ...</p></div>
<div class="chart" id="chartTrend"></div>
<div class="chart" id="chartDailyTotal"></div>
<div class="chart" id="chartCycleStats"></div>

<script>
  let autoRefreshTimeoutHandle = null;
  let fetchedFiles = new Map();
  let chartTraces = [], dailyTraces = [];

  function addZero(i)
  {
    return i < 10 ? "0" + i : i;
  }

  function parseFileDate(file)
  {
    const match = file.match(/data_(\d{4}-\d{2}-\d{2})\.csv/);

    if (!match) {
      return null;
    }

    const [y,m,d] = match[1].split("-");
    return new Date(+y, +m-1, +d).getTime();
  }

  async function fetchFilesInTimeRange(files, startTime, endTime)
  {
    const filesInRange = files.filter(f => {
      const fs = parseFileDate(f);
      return fs && (fs+24*3600*1000 > startTime) && (fs < endTime) && !fetchedFiles.has(f);
    });

    const datasets = await Promise.all(
      filesInRange.map(async f=>{
        const res = await fetch(`${getDomainname()}/fileserver/log/data/${f}`, { credentials:'include' });
        const text = await res.text();
        fetchedFiles.set(f,text);
        return { file: f, text };
      })
    );

    return datasets;
  }

  async function extractData(datasets, numberSequence, startTime, endTime) {
    const rows = [];
    datasets.forEach(txt =>
      txt.split("\n").forEach(line => {
        const cols = line.split(",");
        if (cols.length >= 7 && cols[1] === numberSequence) {
          const ts = new Date(cols[0]).getTime();
          if ((!isNaN(startTime) ? ts >= startTime : true) && (!isNaN(endTime) ? ts <= endTime : true)) {
            rows.push([ts, ...cols.slice(2)]);
          }
        }
      })
    );

    rows.sort((a,b)=>a[0]-b[0]);

    const x=[], actual=[], raw=[], fallback=[], ratePerMin=[], ratePerInterval=[], status=[];
    rows.forEach(([ts,c2,c3,c4,c5,c6,c7])=>{
      x.push(ts);
      raw.push(isFinite(+c2) ? +c2 : null);
      actual.push(+c3 || null);
      fallback.push(+c4 || null);
      ratePerMin.push(+c5 || null);
      ratePerInterval.push(+c6 || null);
      status.push(c7);
    });

    return { x, actual, raw, fallback, ratePerMin, ratePerInterval, status };
  }

  function plotTrendChart({x,actual,raw,fallback,ratePerMin,ratePerInterval})
  {
    chartTraces = [
      { x, y: actual, name:"Actual", type:"scatter", mode:"lines", line:{color:"green"}, yaxis:"y" },
      { x, y: raw, name:"Raw", type:"scatter", mode:"lines", line:{color:"black"}, yaxis:"y", visible:"legendonly", connectgaps: true },
      { x, y: fallback, name:"Fallback", type:"scatter", mode:"lines", line:{color:"blue"}, yaxis:"y", visible:"legendonly" },
      { x, y: ratePerMin, name:"Rate / Min", type:"bar", marker:{color:"magenta"}, yaxis:"y2", opacity: 0.7 },
      { x, y: ratePerInterval, name:"Rate / Interval", type:"bar", marker:{color:"cyan"}, yaxis:"y2", visible:"legendonly", opacity: 0.7 }
    ];

    const chartLayout = {
      title: { text: "📈 Trend", font: { size: 20 }, xref: "container", x: 0.0 },
      autosize: true,
      xaxis: { title: { text: "Date/Time", font: { size: 16 } }, type: "date" },
      yaxis: { title: { text: "Value", font: { size: 16 } } },
      yaxis2: { title: { text: "Rate", font: { size: 16 } }, overlaying: "y", side: "right" },
      hovermode: "x unified",
      showlegend: true,
      legend: { orientation: "h", x:0.05, y: 1.1 },
      margin: { t: 60 }
    };

    const chartConfig = {
      responsive: true,
      displayModeBar: true,
      displaylogo: false,
      modeBarButtonsToRemove: ['select2d', 'lasso2d']
    };

    Plotly.react('chartTrend', chartTraces, chartLayout, chartConfig);

    const d = new Date();
    $('#timestamp').html(`Last Refresh: ${addZero(d.getHours())}:${addZero(d.getMinutes())}:${addZero(d.getSeconds())}`);
    document.getElementById("chartLoadingText").innerHTML = "";
  }

  // Plot daily total
  function calcDailyTotal(xTimestamps, values, startTime, endTime) {
    const dailyMap = new Map();

    xTimestamps.forEach((ts, i) => {
      if (ts < startTime || ts > endTime) {
        return;
      }

      const val = values[i];

      if (val == null || isNaN(val)) {
        return;
      }

      const d = new Date(ts);
      const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

      if (!dailyMap.has(key)) {
        dailyMap.set(key, []);
      }

      dailyMap.get(key).push(val);
    });

    const dailyDates = [], dailyValues = [];
    Array.from(dailyMap.entries())
      .sort((a, b) => new Date(a[0]) - new Date(b[0]))
      .forEach(([key, arr]) => {
        dailyValues.push(arr[arr.length - 1] - arr[0]);
        const [year, month, day] = key.split('-').map(Number);
        const date = new Date(year, month - 1, day);
        dailyDates.push(date.getTime());
      });

    return { dailyDates, dailyValues };
  }

  function plotDailyTotalChart(dailyDates, dailyValues)
  {
    // Calculate range sum
    const totalSum = dailyValues.length > 0 ? dailyValues.reduce((a, b) => a + b, 0) : 0;

    // Average of daily differences
    const avgValue = parseFloat((totalSum / dailyValues.length).toFixed(3));
    const avgLine = dailyDates.map(() => avgValue);

    const dailyTraces = [
      {
        x: dailyDates,
        y: dailyValues,
        type: "bar",
        name: "Daily",
        marker: { color: "rgba(128,0,128,0.5)" },
        yaxis: "y1",
        width: dailyDates.length === 1 ? 24 * 60 * 60 * 1000 * 0.80 : undefined
      },
      {
        x: dailyDates,
        y: avgLine,
        type: "scatter",
        mode: "lines",
        name: "Average (Range)",
        line: { color: "orange", width: 2, dash: "dot" },
        yaxis: "y1"
      },
      {
        x: [dailyDates[dailyDates.length - 1] + 12 * 3600 * 1000], // 12h after last date
        y: [totalSum],
        type: "scatter",
        mode: "markers+text",
        name: "Total (Range)",
        marker: { color: "blue", size: 12, symbol: "diamond" },
        text: [`Σ ${totalSum.toFixed(3)}`],
        textposition: "bottom center",
        yaxis: "y2"
      }
    ];

    const dailyLayout = {
      title: { text: "📊 Daily Total", font: { size: 20 }, xref: "container", x: 0.0 },
      autosize: true,
      xaxis: {
        title: { text: "Day", font: { size: 16 } },
        type: "date",
        dtick: 86400000
      },
      yaxis: {
        title: { text: "Value", font: { size: 16 } }
      },
      yaxis2: {
        title: { text: "Total (Range)", font: { size: 16 } },
        overlaying: "y",
        side: "right",
        showgrid: false,
        rangemode: "tozero"
      },
      hovermode: "x unified",
      showlegend: true,
      legend: { orientation: "h", x: 0.05, y: 1.1 },
      margin: { t: 60 }
    };

    const chartConfig = {
      responsive: true,
      displayModeBar: true,
      displaylogo: false,
      modeBarButtonsToRemove: ['select2d', 'lasso2d']
    };

    Plotly.react('chartDailyTotal', dailyTraces, dailyLayout, chartConfig);
  }

  // Plot cycle stats
  function evalCycleStats(xTimestamps, valueStatus, startTime, endTime)
  {
    const dailyMap = new Map();

    for (let i = 0; i < xTimestamps.length; i++) {
      const ts = xTimestamps[i];
      if (ts < startTime || ts > endTime) {
        continue;
      }

      const val = valueStatus[i];
      if (!val) {
        continue;
      }

      const d = new Date(ts);
      const dayKey = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;

      if (!dailyMap.has(dayKey)) {
        dailyMap.set(dayKey, { good: 0, failed: 0 });
      }

      if (val === '000' || val === 'E91') {
        dailyMap.get(dayKey).good += 1;
      }
      else if (val === 'E92' || val === 'E93') {
        dailyMap.get(dayKey).failed += 1;
      }
    }

    const days = [], goodCounts = [], failedCounts = [];

    Array.from(dailyMap.entries())
      .sort((a, b) => {
        const [yA, mA, dA] = a[0].split('-').map(Number);
        const [yB, mB, dB] = b[0].split('-').map(Number);
        return new Date(yA, mA - 1, dA) - new Date(yB, mB - 1, dB);
      })
      .forEach(([key, counts]) => {
        const [year, month, day] = key.split('-').map(Number);
        const date = new Date(year, month - 1, day);
        days.push(date.getTime());
        goodCounts.push(counts.good);
        failedCounts.push(counts.failed);
      });

    return { days, goodCounts, failedCounts };
  }

  function plotCycleStatsChart(days, goodCounts, failedCounts)
  {
    const traces = [
      {
        x: days,
        y: goodCounts,
        name: "Good",
        type: "bar",
        marker: { color: "green" },
        text: goodCounts.map((val, i) => {
          const total = goodCounts[i] + failedCounts[i];
          const pct = total > 0 ? ((val / total) * 100).toFixed(2) : 0;
          return `Good: ${val} (${pct}%)`;
        }),
        hoverinfo: "text"
      },
      {
        x: days,
        y: failedCounts,
        name: "Failed",
        type: "bar",
        marker: { color: "red" },
        text: failedCounts.map((val, i) => {
          const total = goodCounts[i] + failedCounts[i];
          const pct = total > 0 ? ((val / total) * 100).toFixed(2) : 0;
          return `Failed: ${val} (${pct}%)`;
        }),
        hoverinfo: "text"
      }
    ];

    const chartLayout = {
      title: { text: "📊 Cycle Stats", font: { size: 20 }, xref: "container", x: 0 },
      xaxis: { title: { text: "Day", font: { size: 16 } }, type: "date", dtick: 86400000 },
      yaxis: { title: { text: "Cycle Count", font: { size: 16 } } },
      barmode: "stack",
      hovermode: "x unified",
      margin: { t:60 },
      showlegend: true,
      legend: { orientation: "h", x: 0.08, y: 1.07 }
    };

    const chartConfig = {
      responsive: true,
      displayModeBar: true,
      displaylogo: false,
      modeBarButtonsToRemove: ['select2d', 'lasso2d']
    };

    Plotly.react('chartCycleStats', traces, chartLayout, chartConfig);
  }


  async function run()
  {
    const numberSequence = document.getElementById("sequence_selection").value;
    const startTime = new Date(document.getElementById("startTime").value).getTime();
    const endTime = new Date(document.getElementById("endTime").value).getTime();
    const files = dataFileListObj.files.sort();

    await fetchFilesInTimeRange(files, startTime, endTime);
    const dataSet = await extractData(Array.from(fetchedFiles.values()), numberSequence, startTime, endTime);

    plotTrendChart(dataSet);

    const { dailyDates, dailyValues } = calcDailyTotal(dataSet.x, dataSet.actual, startTime, endTime);
    plotDailyTotalChart(dailyDates, dailyValues);

    const { days, goodCounts, failedCounts } = evalCycleStats(dataSet.x, dataSet.status.map(String), startTime, endTime);
    plotCycleStatsChart(days, goodCounts, failedCounts);
  }


  function initAutoRefreshContent()
  {
    document.getElementById("AutoRefreshEnabled").checked = jsonConfig.webui.autorefresh.datagraphpage.enabled;
    document.getElementById("AutoRefreshTime").value = jsonConfig.webui.autorefresh.datagraphpage.refreshtime;
    AutoRefreshContent();
  }

  function AutoRefreshContent()
  {
    if (document.getElementById("AutoRefreshEnabled").checked) {
      if (autoRefreshTimeoutHandle) {
        clearTimeout(autoRefreshTimeoutHandle); autoRefreshTimeoutHandle=null;
      }

      let autoRefreshTime = document.getElementById("AutoRefreshTime").value*1000;
      if (!autoRefreshTime) {
        document.getElementById("AutoRefreshEnabled").checked=false; return;
      }
      autoRefreshTimeoutHandle = setTimeout(()=>{ run(); AutoRefreshContent(); }, autoRefreshTime);
    }
    else {
      if (autoRefreshTimeoutHandle) {
        clearTimeout(autoRefreshTimeoutHandle); autoRefreshTimeoutHandle=null;
      }
    }
  }

  async function ManualRefreshContent()
  {
    const spinner = document.getElementById("manual_refresh_img_loading");
    spinner.style.visibility = "visible";

    try {
      await run();
    }
    finally {
      setTimeout(function() { // Show loading spinner at least for 200ms
        spinner.style.visibility = "hidden";
      }, 200);
    }
  }


  async function init()
  {
    try {
      [dataFileListObj] = await Promise.all([getDataFileList(), loadConfig()]);
    }
    catch (err) {
      firework.launch('Failed loading data for graph page. Please repeat or check logs', 'danger', 30000);
      console.error("Failed loading data for graph page. Error: " + error.message);
      return;
    }

    jsonConfig = getConfigFromStorage();

    // Fill dropdown
    jsonConfig.numbersequences.sequence.forEach(seq=>{
      document.getElementById("sequence_selection").add(new Option(seq.sequencename, seq.sequencename));
    });

    // Set default time to today
    const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
    const todaysEnd = new Date(todayMidnight.getTime()+24*3600*1000-1);

    function formatLocalDatetime(dt) {
      const pad = n => n.toString().padStart(2,'0');
      return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    }

    document.getElementById("startTime").value = formatLocalDatetime(todayMidnight);
    document.getElementById("endTime").value = formatLocalDatetime(todaysEnd);

    // Preset with loading indicator
	  document.getElementById("manual_refresh_img_loading").src = getDomainname() + '/img_loading.gif?v=$COMMIT_HASH';

    initAutoRefreshContent();
    run();
  }

  init();
</script>
</body>
</html>
