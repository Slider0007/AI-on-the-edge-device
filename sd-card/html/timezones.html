<!doctype html>
<html lang="en">

<head>
  <title>Timezones</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=720" />

  <script>
    // Theme Control
    (function () {
      let theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { }
      if (theme !== 'light' && theme !== 'dark') {
        try { theme = document.cookie.match(/(?:^|; )theme=(light|dark)/)?.[1]; } catch (e) { }
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(theme);
    })();
  </script>

  <link rel="stylesheet" href="style-iframe.css?v=$COMMIT_HASH" />

  <style>
    * {
      box-sizing: border-box;
      max-width: 680px;
    }

    #myInput {
      background-image: url('/css/searchicon.png');
      background-position: 10px 10px;
      background-repeat: no-repeat;
      width: 100%;
      padding: 12px 20px 12px 40px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      border-radius: var(--input-radius);
    }

    #data {
      border-collapse: collapse;
      width: 100%;
      border: 1px solid var(--border);
    }

    #data th,
    #data td {
      text-align: left;
      padding: 12px;
    }

    #data tr {
      border-bottom: 1px solid var(--border);
    }

    #data tr.header,
    #data tr:hover {
      background-color: var(--surface-hover);
    }
  </style>
</head>

      ["Pacific/Pago_Pago", 96],
      ["Pacific/Palau", 47],
      ["Pacific/Pitcairn", 83],
      ["Pacific/Pohnpei", 33],
      ["Pacific/Port_Moresby", 35],
      ["Pacific/Rarotonga", 78],
      ["Pacific/Saipan", 93],
      ["Pacific/Tahiti", 78],
      ["Pacific/Tarawa", 43],
      ["Pacific/Tongatapu", 75],
      ["Pacific/Wake", 43],
      ["Pacific/Wallis", 43]
    ];

    const rows = document.getElementById('timezoneRows');
    const fragment = document.createDocumentFragment();

    for (const [region, codeIndex] of timezones) {
      const row = document.createElement('tr');
      const regionCell = document.createElement('td');
      const codeCell = document.createElement('td');

      regionCell.textContent = region;
      codeCell.textContent = timezoneCodes[codeIndex];
      row.append(regionCell, codeCell);
      fragment.appendChild(row);
    }

    rows.appendChild(fragment);

    // Filter rows by timezone region name, matching the original behavior.
    document.getElementById('myInput').addEventListener('input', function () {
      const filter = this.value.toUpperCase();

      for (const row of rows.rows) {
        const region = row.cells[0].textContent.toUpperCase();
        row.style.display = region.includes(filter) ? '' : 'none';
      }
    });
  </script>
</body>

</html>
