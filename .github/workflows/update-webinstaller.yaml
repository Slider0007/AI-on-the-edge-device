name: Update Web Installer

# Updates branch gh-pages-webinstaller with the firmware files of a release.
# - Called from the release workflow (build-release.yml) with the new tag.
# - Can be run manually; without a tag the latest release is used.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = latest release)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (empty = latest release)'
        required: false
        type: string

# Only one run at a time: all runs push to the same branch.
concurrency:
  group: update-webinstaller
  cancel-in-progress: false

jobs:
  update-webinstaller:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        plat:
         - esp32cam
         - freenove-esp32s3-n8r8
         - freenove-esp32s3-n16r8
         - nulllab-esp32s3-cam
         - waveshare-esp32s3-eth
         - xiao-esp32s3-sense

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      INPUT_TAG: ${{ inputs.tag }}
      PLAT: ${{ matrix.plat }}

    steps:
    - name: Checkout branch gh-pages-webinstaller
      uses: actions/checkout@v7
      with:
        ref: gh-pages-webinstaller

    - name: Resolve release tag
      id: rel
      run: |
        TAG="$INPUT_TAG"
        if [ -z "$TAG" ]; then
          TAG=$(gh release view --json tagName --jq .tagName)
        fi
        echo "Release tag: $TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Download release asset
      env:
        TAG: ${{ steps.rel.outputs.tag }}
      run: |
        rm -rf ./artifacts
        mkdir -p ./artifacts
        gh release download "$TAG" \
          --pattern "AI-on-the-edge-device__${PLAT}__SLFork_*.zip" \
          --dir ./artifacts

    - name: Prepare data
      env:
        VER: ${{ steps.rel.outputs.tag }}
      run: |
        echo "Updating files ..."
        unzip -o ./artifacts/AI-on-the-edge-device__${PLAT}__SLFork_*.zip -d ./artifacts/pkg

        rm -rf "./firmware/${PLAT}"
        mkdir -p "./firmware/${PLAT}"
        cp -f ./artifacts/pkg/bootloader.bin "./firmware/${PLAT}/bootloader.bin"
        cp -f ./artifacts/pkg/partitions.bin "./firmware/${PLAT}/partitions.bin"
        cp -f ./artifacts/pkg/firmware.bin   "./firmware/${PLAT}/firmware.bin"

        echo "Updating version strings (index.html, manifest) ..."
        sed -i -E "s|Firmware: .*|Firmware: <b>${VER}</b>|" index.html
        sed -i -E "s|\"version\":[^,]*,|\"version\": \"${VER}\",|" "manifest_${PLAT}.json"

    - name: Commit data to branch gh-pages-webinstaller
      env:
        VER: ${{ steps.rel.outputs.tag }}
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        # Add only the installer files, never the downloaded ./artifacts
        git add firmware index.html "manifest_${PLAT}.json"
        if ! git diff --cached --quiet; then
          git commit -m "${PLAT}: Update firmware files to ${VER}"
          git push
        fi