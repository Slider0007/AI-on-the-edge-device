name: Build and Release

on:
  push:
    branches-ignore:
      - 'release-please--*'
  pull_request:
    branches-ignore:
      - 'release-please--*'
  workflow_dispatch:

jobs:
#########################################################################################
## Create release - PART 1: Prepare Release PR / Create release tag
#
# Use of release-please action to create a 'Release PR' which gets maintained automatically.
# After merging the 'Release PR', a new tag and release is getting created.
#########################################################################################
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      version: "${{steps.release.outputs.major}}.${{steps.release.outputs.minor}}.${{steps.release.outputs.patch}}"
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: ${{ (github.base_ref == 'develop' || startsWith(github.base_ref, 'release/v')) && github.base_ref || ((github.ref_name == 'develop' || startsWith(github.ref_name, 'release/v')) && github.ref_name || 'develop') }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json


#########################################################################################
## Build Firmware
#########################################################################################
  build:
    runs-on: ubuntu-latest
    needs: [prepare-release]
    strategy:
      fail-fast: false
      matrix:
        plat:
         - esp32cam
         - freenove-esp32s3-n8r8
         - freenove-esp32s3-n16r8
         - nulllab-esp32s3-cam
         - waveshare-esp32s3-eth
         - xiao-esp32s3-sense
    steps:
    - name: Checkout branch
      if: ${{ ! needs.prepare-release.outputs.release_created }}
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Checkout tag # checkout tagged version when build a release for this tag
      if: ${{ needs.prepare-release.outputs.release_created }}
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.tag_name }}
        submodules: recursive

    - name: Cache PIO build files
      if: ${{ ! needs.prepare-release.outputs.release_created }} # do not use cached data when building a release
      uses: actions/cache@v6
      with:
        path: ./code/.pio
        key: build-${{ matrix.plat }}-${{ github.run_id }}
        restore-keys: build-${{ matrix.plat }} # This matches above key as it is only used as a prefix. It restores the nearest cache

    - name: Setup python environment
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install PlatformIO environment
      run: |
        python -m pip install --upgrade pip
        pip install markdown esp_idf_size
        pip install --upgrade platformio

    - name: Build firmware
      run: cd code; platformio run -e ${{ matrix.plat }}

    - name: Read firmware version
      id: ver
      run: |
        V=$(head -n1 sd-card/html/version.txt | tr -d '\r' | sed 's/[^A-Za-z0-9._+-]/_/g')
        if [ -z "$V" ]; then
          echo "::error::sd-card/html/version.txt is missing or empty"
          exit 1
        fi
        echo "Firmware version: $V"
        echo "version=$V" >> "$GITHUB_OUTPUT"

    #########################################################################################
    ## Prepare firmware package
    #
    # Package contents:
    #  - Firmware binaries (firmware.bin, partitions.bin, bootloader.bin)
    #  - WebUI files (/html/* (inkl. subfolders))
    #  - Config files (/config/templates/*, /config/models/*.tflite)
    #########################################################################################
    - name: Firmware package - Prepare artifact
      run: |
        rm -rf ./artifact
        mkdir -p ./artifact
        cp -f "./code/.pio/build/${{ matrix.plat }}/firmware.bin" "./artifact/firmware.bin"
        cp -f "./code/.pio/build/${{ matrix.plat }}/bootloader.bin" "./artifact/bootloader.bin"
        cp -f "./code/.pio/build/${{ matrix.plat }}/partitions.bin" "./artifact/partitions.bin"
        cp -f "./docs/Installation/DeviceReadme/${{ matrix.plat }}.md" "./artifact/README.md"

        if [ -d "./.builds/html_compiled" ]; then
            cp -r ./.builds/html_compiled ./artifact/html
        else
            cp -r ./sd-card/html ./artifact/html
        fi

        rm -rf ./artifact/config/
        mkdir -p ./artifact/config
        mkdir -p ./artifact/config/templates
        mkdir -p ./artifact/config/models
        cp ./sd-card/config/templates/* ./artifact/config/templates/ 2>/dev/null || true
        cp ./sd-card/config/models/*.tfl ./artifact/config/models/ 2>/dev/null || true
        cp ./sd-card/config/models/*.tflite ./artifact/config/models/ 2>/dev/null || true

    - name: Firmware package - Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: "AI-on-the-edge-device__${{ matrix.plat }}__SLFork_${{ steps.ver.outputs.version }}"
        path: ./artifact

    #########################################################################################
    ## Prepare package with additional files for debugging purpose
    #
    # Package contents:
    # - firmware.elf
    # - sdkconfig.${{ matrix.plat }}
    #########################################################################################
    - name: Debug files package - Prepare artifact
      run: |
        rm -rf ./debug
        mkdir -p ./debug

        cp -f "./code/.pio/build/${{ matrix.plat }}/firmware.elf" "debug/firmware.elf"
        cp -f "./code/sdkconfig.${{ matrix.plat }}" "debug/sdkconfig.${{ matrix.plat }}"
        cp -f "./code/dependencies.lock" "debug/dependencies.lock"

    - name: Debug files package - Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: "aioted__debug-files_developer-only__${{ matrix.plat }}__SLFork_${{ steps.ver.outputs.version }}"
        path: ./debug


#########################################################################################
## Create release - PART 2: Upload release related artifacts
#
# Artifacts will be uploaded to newly created release tag
#########################################################################################
  upload-release-artifacts:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: ${{ needs.prepare-release.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        plat:
         - esp32cam
         - freenove-esp32s3-n8r8
         - freenove-esp32s3-n16r8
         - nulllab-esp32s3-cam
         - waveshare-esp32s3-eth
         - xiao-esp32s3-sense

    # Sets permissions of the GITHUB_TOKEN to allow downloading artifacts
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout tag
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.tag_name }}

    - name: Pull artifact
      uses: actions/download-artifact@v8
      with:
        pattern: "AI-on-the-edge-device__${{ matrix.plat }}__*"
        path: ./pkg
        merge-multiple: true

    - name: Prepare and upload release asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        rm -rf release
        mkdir -p release
        (cd pkg && zip -r "../release/AI-on-the-edge-device__${{ matrix.plat }}__SLFork_v${{ needs.prepare-release.outputs.version }}.zip" .)
        gh release upload ${{ needs.prepare-release.outputs.tag_name }} release/*


#########################################################################################
## Create release - PART 3: Combine all debug files into one artifact and upload
#
# All per-platform debug artifacts are merged into a single zip and uploaded to the release
#########################################################################################
  upload-release-debug-artifact:
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: ${{ needs.prepare-release.outputs.release_created }}

    # Sets permissions of the GITHUB_TOKEN to allow uploading to the release
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout tag
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.prepare-release.outputs.tag_name }}

    - name: Pull all debug artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: "aioted__debug-files_developer-only__*"
        path: ./debug
        merge-multiple: false

    - name: Combine and zip all debug artifacts
      run: |
        mkdir -p release
        cd debug
        # Each platform's files land in their own subdirectory named after the artifact;
        # zip them all together, preserving the per-platform folder structure.
        zip -r ../release/aioted__debug-files_developer-only__SLFork_v${{ needs.prepare-release.outputs.version }}.zip .
        cd ..

    - name: Upload combined debug artifact to release tag
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload ${{ needs.prepare-release.outputs.tag_name }} release/*

#########################################################################################
## Update web installer (branch: gh-pages-webinstaller)
#########################################################################################
  update-webinstaller:
    needs: [prepare-release, upload-release-artifacts]
    if: ${{ needs.prepare-release.outputs.release_created }}
    permissions:
      contents: write
    uses: ./.github/workflows/update-webinstaller.yaml
    with:
      tag: ${{ needs.prepare-release.outputs.tag_name }}