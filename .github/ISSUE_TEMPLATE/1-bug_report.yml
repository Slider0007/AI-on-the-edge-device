name: 🐞 Bug Report
description: File a bug report
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        **Thank you for taking the time to submit this bug report!**
        **For general discussions or any other requests, please start a conversation in the “Discussions” tab.**
  - type: textarea
    attributes:
      label: Description
      description: Please describe, what happend, what did you expect to happen and how can it be reproduced
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Please provide any relevant logs (WebUI `System > Log Viewer` or console log). The content will be automatically formatted
      render: shell
  - type: input
    attributes:
      label: Firmware Version
      description: Which firmware version are you using? (WebUI `System > Info > Build > Firmware Version` or check console log during boot)
    validations:
      required: true
  - type: input
    attributes:
      label: Hardware Platform
      description: Which hardware platform (board, camera) are you using?
    validations:
      required: true
